name: TradeBridge Android emulator smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'tradebridge-android/**'
      - '.github/workflows/tradebridge-android-emulator-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd tradebridge-android
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.tradebridge.us/.MainActivity
            sleep 12
            mkdir -p ../smoke-results
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml ../smoke-results/window.xml
            adb shell screencap -p /sdcard/launcher.png
            adb pull /sdcard/launcher.png ../smoke-results/launcher.png
            grep -F 'TradeBridge US' ../smoke-results/window.xml
            adb shell dumpsys activity activities | grep -F 'com.tradebridge.us'
            adb logcat -d -v time -t 1000 > ../smoke-results/logcat.txt
            if grep -E 'FATAL EXCEPTION.*|Process: com.tradebridge.us' ../smoke-results/logcat.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradebridge-android-emulator-smoke-results
          path: smoke-results/
          if-no-files-found: warn
