name: TradeBridge US Android build (UNSIGNED)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tradebridge-android/**'
      - '.github/workflows/tradebridge-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android binaries
        working-directory: tradebridge-android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tradebridge-android-unsigned
          path: |
            tradebridge-android/app/build/outputs/apk/debug/*.apk
            tradebridge-android/app/build/outputs/bundle/release/*.aab
